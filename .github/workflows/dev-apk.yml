name: Dev APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew && ./gradlew assembleDevDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Dev build
          files: app/build/outputs/apk/dev/debug/*.apk
